<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lee's Soles — Shoes for Every Step</title>
<meta name="description" content="Browse the full shoe catalog and order directly on WhatsApp.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="header-left">
    <a class="brand" href="#top">Lee's Soles</a>
    <span class="brand-sub">NAIROBI · NEW STOCK EVERY WEEK</span>
  </div>
  <a class="header-cta" id="header-whatsapp" href="#" target="_blank" rel="noopener">
    💬 Chat on WhatsApp
  </a>
</header>

<div class="controls" id="top">
  <div class="search-box">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="search-input" placeholder="Search shoes… name, category, size">
  </div>
  <div class="category-tabs" id="category-tabs">
    <!-- category buttons injected by app.js -->
  </div>
</div>

<p class="result-count" id="result-count"></p>

<main class="grid" id="product-grid">
  <!-- product cards injected by app.js -->
</main>

<p class="empty-state" id="empty-state">No shoes match that search. Try a different name, category, or size.</p>

<footer class="site-footer">
  <p>Lee's Soles — questions? <a id="footer-whatsapp" href="#" target="_blank" rel="noopener">Message us on WhatsApp</a></p>
</footer>

<a class="float-cta" id="float-whatsapp" href="#" target="_blank" rel="noopener" aria-label="Chat on WhatsApp">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.71.45 3.38 1.3 4.85L2 22l5.36-1.4a9.9 9.9 0 0 0 4.68 1.19h.01c5.46 0 9.91-4.45 9.91-9.91C21.96 6.45 17.5 2 12.04 2zm0 18.03h-.01a8.2 8.2 0 0 1-4.18-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.2 8.2 0 0 1-1.26-4.35c0-4.54 3.7-8.24 8.25-8.24 4.54 0 8.24 3.7 8.24 8.24 0 4.55-3.7 8.21-8.25 8.21zm4.51-6.16c-.25-.12-1.47-.72-1.7-.8-.23-.08-.4-.12-.56.12-.17.25-.65.8-.8.96-.15.17-.29.19-.54.06-.25-.12-1.06-.39-2.01-1.24-.74-.66-1.24-1.48-1.39-1.73-.14-.25-.02-.38.11-.5.11-.11.25-.29.37-.43.12-.15.16-.25.25-.42.08-.17.04-.31-.02-.43-.06-.12-.56-1.36-.77-1.86-.2-.48-.41-.42-.56-.43-.14-.01-.31-.01-.48-.01a.9.9 0 0 0-.66.31c-.23.25-.87.85-.87 2.08s.89 2.42 1.02 2.59c.12.17 1.75 2.67 4.25 3.75.59.26 1.06.41 1.42.52.6.19 1.14.16 1.57.1.48-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.15-1.18-.06-.1-.23-.16-.48-.28z"/></svg>
</a>

<!-- Modal Overlay & Bottom Sheet -->
<div class="modal-overlay" id="modal-overlay"></div>
<div class="modal-sheet" id="modal-sheet" role="dialog" aria-modal="true">
  <button class="modal-close" id="modal-close" aria-label="Close modal">&times;</button>
  <div class="modal-image-wrap">
    <img id="modal-img" src="" alt="" loading="eager">
  </div>
  <div class="modal-gallery-strip" id="modal-gallery-strip"></div>
  <div class="modal-body">
    <span class="modal-category" id="modal-category"></span>
    <h2 class="modal-name" id="modal-name"></h2>
    <p class="modal-sizes" id="modal-sizes"></p>
    <div class="modal-price-row">
      <span class="modal-price" id="modal-price"></span>
      <span class="modal-sku" id="modal-sku"></span>
    </div>
    <a class="order-btn" id="modal-order-btn" href="#" target="_blank" rel="noopener">
      Order Now
    </a>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
